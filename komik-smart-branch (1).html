<title>Komik Smart Branch</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style>
/* Layout: komik episodik berpalet Bank Mandiri — latar navy bergelombang emas, tiap episode satu kartu putih berkepala navy-emas, panel bertinta navy; berganti episode dengan geser lembut (tanpa efek buku) */
:root{
  --navy:#003d79;      /* biru utama */
  --navy-d:#0a1f44;    /* tinta */
  --blue:#1e6fd9;
  --sky:#4c9be0;
  --gold:#ffb700;      /* emas utama */
  --gold-l:#ffd36b;    /* kotak narasi */
  --cream:#fff8e6;
  --white:#ffffff;
  --muted:#4b5a78;
  --alert:#e0343f;
  --f-display:"Bangers","Impact","Arial Narrow Bold",sans-serif;
  --f-letter:"Comic Neue","Trebuchet MS","Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--navy);color:var(--navy-d);font-family:var(--f-letter);
  background-image:radial-gradient(1200px 400px at 50% -120px,#1e6fd9 0,transparent 70%),repeating-linear-gradient(135deg,rgba(255,255,255,.035) 0 2px,transparent 2px 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 44px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.brand{font-family:var(--f-display);color:var(--gold);font-size:28px;letter-spacing:1.2px;line-height:1;text-shadow:2px 2px 0 var(--navy-d)}
.brand small{display:block;font-family:var(--f-letter);font-weight:700;color:#d6e6ff;font-size:12px;letter-spacing:.1em;text-shadow:none;margin-top:5px;text-transform:uppercase}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{font-family:var(--f-display);font-size:18px;letter-spacing:1px;background:var(--gold);color:var(--navy-d);border:3px solid var(--navy-d);border-radius:10px;padding:5px 14px 3px;cursor:pointer;box-shadow:0 4px 0 var(--navy-d);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--navy-d)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy-d)}
.btn.ghost{background:var(--white)}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible,.dot:focus-visible,.actor:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{min-width:36px;height:36px;border:3px solid var(--navy-d);border-radius:50%;background:var(--white);font-family:var(--f-display);font-size:18px;cursor:pointer;color:var(--navy)}
.dot[aria-current="true"]{background:var(--gold);color:var(--navy-d);box-shadow:0 0 0 3px var(--white)}

.page{background:var(--white);border:3px solid var(--navy-d);border-radius:16px;overflow:hidden;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.page[hidden]{display:none!important}
.all .page{margin-bottom:22px}
.phead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--navy);border-bottom:5px solid var(--gold);padding:10px 14px}
.ep{font-family:var(--f-display);font-size:15px;letter-spacing:1px;background:var(--gold);color:var(--navy-d);border-radius:999px;padding:4px 12px 2px;white-space:nowrap}
.phead h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:clamp(24px,4.2vw,36px);letter-spacing:1.3px;color:var(--white);line-height:1;text-wrap:balance;flex:1 1 220px}
.phead .kick{font-weight:700;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-l)}
.body{padding:12px}

.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.panel{grid-column:span var(--s,6);position:relative;border:3px solid var(--navy-d);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;min-height:340px;min-width:0;background:#d6ab7a}
.panel>.scene{position:absolute;inset:0;width:100%;height:100%;z-index:0;display:block}
.panel::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(10,31,68,.09) 1px,transparent 1.5px);background-size:6px 6px;pointer-events:none;z-index:1}
.panel>*:not(.scene):not(.sfx){position:relative;z-index:2}
.k-eform{min-height:490px}
.place+*{margin-top:28px}
.plain{background:linear-gradient(160deg,var(--navy),#0b4f9c);min-height:auto}
.plain::after{content:"";position:absolute;right:-40px;top:-30px;width:260px;height:120px;border-radius:50%;border:14px solid var(--gold);opacity:.25;z-index:1}
.place{position:absolute;left:8px;top:8px;z-index:3;font-family:var(--f-display);font-size:12.5px;letter-spacing:.8px;background:var(--navy);color:var(--gold);border:2px solid var(--navy-d);border-radius:999px;padding:2px 9px 0}

.cap{align-self:flex-start;margin:0;background:var(--gold-l);border:2.5px solid var(--navy-d);border-radius:4px;padding:6px 9px;font-weight:700;font-size:12.5px;line-height:1.35;text-transform:uppercase;max-width:86%;box-shadow:2px 2px 0 rgba(10,31,68,.35)}
.cap b.big{font-family:var(--f-display);font-weight:400;font-size:22px;letter-spacing:1px;line-height:1;margin-right:2px;color:var(--navy)}
.caps{display:grid;gap:6px;padding:8px 8px 0}
.caps.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.step{display:grid;grid-template-columns:30px 1fr;column-gap:10px;align-items:center;background:var(--white);border:2.5px solid var(--navy-d);border-radius:8px;padding:8px 10px;position:relative;font-weight:700;font-size:12.5px;line-height:1.35;text-transform:uppercase;box-shadow:3px 3px 0 rgba(10,31,68,.3);min-width:0}
.step::before{content:attr(data-n);width:30px;height:30px;border-radius:50%;background:var(--navy);color:var(--gold);border:2px solid var(--navy-d);display:grid;place-items:center;font-family:var(--f-display);font-size:18px;line-height:1;padding-top:2px}
.step>span{min-width:0}
.step em{font-style:normal;background:var(--gold-l);padding:0 3px}
.top{padding:8px 8px 0}
.bals{display:flex;flex-wrap:wrap;gap:12px 8px;padding:8px 8px 14px;align-items:flex-start}
.bal{position:relative;background:var(--white);border:2.5px solid var(--navy-d);border-radius:20px;padding:8px 11px 7px;font-weight:700;font-size:12.5px;line-height:1.32;text-transform:uppercase;flex:1 1 170px;min-width:0;max-width:100%;overflow-wrap:anywhere;box-shadow:2px 2px 0 rgba(10,31,68,.22);animation:bob 3.4s ease-in-out infinite;animation-delay:calc(var(--d,0)*-.7s)}
.bal::after{content:"";position:absolute;bottom:-13px;width:16px;height:14px;background:var(--white);border-right:2.5px solid var(--navy-d);border-bottom:2.5px solid var(--navy-d);clip-path:polygon(0 0,100% 0,100% 100%)}
.bal.t-l::after{left:22px;transform:skewX(25deg)}
.bal.t-r::after{right:22px;transform:skewX(-25deg) scaleX(-1)}
.bal .who{display:inline-block;font-family:var(--f-display);font-weight:400;font-size:13px;letter-spacing:.8px;color:var(--gold);background:var(--navy);border-radius:4px;padding:1px 6px 0;margin-right:5px;transform:translateY(-1px)}
.bal.shout{border-width:3.5px;border-radius:8px;border-color:var(--navy);transform:rotate(-1deg);font-size:13px;background:#fffdf3}
.bal em{font-style:normal;color:var(--blue)}
.bal.wide{flex-basis:100%}

.stage{margin-top:auto;height:214px;display:flex;justify-content:center;align-items:flex-end;padding:0 6px;position:relative}
.actor{flex:0 1 124px;min-width:58px;margin:0 -6px;display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative}
.actor .fig{width:100%;height:auto;max-height:206px;display:block;overflow:visible;animation:breathe 4s ease-in-out infinite;transform-origin:50% 100%;filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(3px 5px 0 rgba(10,31,68,.45))}
.actor::before{content:"";position:absolute;bottom:4px;left:12%;right:12%;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,183,0,.55),rgba(255,183,0,0));z-index:-1}
.actor.flip .fig{transform:scaleX(-1);animation-name:breatheF}
.actor .tag{position:absolute;bottom:2px;font-family:var(--f-display);font-size:14px;letter-spacing:.8px;background:var(--navy);color:var(--gold);border:2.5px solid var(--gold);box-shadow:0 0 0 2px var(--navy-d),0 3px 0 2px var(--navy-d);border-radius:999px;padding:2px 10px 0;line-height:1.1;white-space:nowrap}
.actor.jump .fig{animation:jump .55s ease}
.actor.flip.jump .fig{animation:jumpF .55s ease}
.sfx{position:absolute;z-index:3;font-family:var(--f-display);color:var(--gold);font-size:clamp(26px,4vw,40px);letter-spacing:1.5px;-webkit-text-stroke:2px var(--navy-d);text-shadow:3px 3px 0 var(--blue),5px 5px 0 var(--navy-d);pointer-events:none;transform:rotate(var(--r,-8deg));animation:sfx 2.6s ease-in-out infinite;white-space:nowrap;line-height:1}
.sfx.alert{color:var(--white);text-shadow:3px 3px 0 var(--alert),5px 5px 0 var(--navy-d)}
.sfx.big{font-size:clamp(34px,6vw,58px)}

.cover{min-height:auto;background:#1d3366;border-radius:10px}
.logobar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--white);border-bottom:4px solid var(--gold);padding:6px 12px}
.logobar img{height:clamp(16px,2.6vw,24px);width:auto;max-width:44%;object-fit:contain;display:block}
.cover-in{padding:16px 16px 14px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;background:linear-gradient(#003d79e6,#003d79b3 75%,#003d7900)}
.issue{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.issue span{background:var(--gold);color:var(--navy-d);border:2.5px solid var(--navy-d);border-radius:999px;font-family:var(--f-display);font-size:16px;letter-spacing:1px;padding:3px 12px 1px}
.ctitle{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:clamp(44px,10vw,92px);line-height:.9;color:var(--gold);-webkit-text-stroke:2.5px var(--navy-d);text-shadow:4px 4px 0 var(--blue),8px 8px 0 var(--navy-d);letter-spacing:2px;text-wrap:balance}
.csub{font-family:var(--f-display);font-weight:400;color:var(--white);letter-spacing:1.2px;font-size:clamp(18px,2.6vw,24px);background:var(--navy);border:2.5px solid var(--gold);border-radius:999px;padding:5px 18px 3px;margin:2px 0 0}
.blurbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;margin-top:6px}
.blurbs div{background:var(--white);border:2.5px solid var(--navy-d);border-top:6px solid var(--gold);border-radius:8px;padding:6px;font-weight:700;font-size:11.5px;text-transform:uppercase;line-height:1.3;box-shadow:0 4px 0 var(--navy-d)}
.blurbs b{display:block;font-family:var(--f-display);font-weight:400;font-size:19px;letter-spacing:1px;color:var(--navy)}
.cover .stage{height:224px}
.tbl{overflow-x:auto;padding:8px}
table{border-collapse:collapse;width:100%;min-width:560px;background:var(--white);border:3px solid var(--navy-d);font-size:12.5px;line-height:1.35}
th,td{border:2px solid var(--navy-d);padding:6px 8px;text-align:left;vertical-align:top}
thead th{background:var(--navy);color:var(--gold);font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:1px}
tbody th{background:var(--gold-l);text-transform:uppercase;font-size:12px}
td strong{background:var(--gold-l);padding:0 3px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:12px}
.stat{background:var(--white);border:3px solid var(--navy-d);border-top:8px solid var(--gold);border-radius:10px;box-shadow:0 5px 0 var(--navy-d);padding:9px 8px;text-align:center;min-width:0}
.stat b{display:block;font-family:var(--f-display);font-weight:400;color:var(--navy);font-size:clamp(24px,3.6vw,32px);line-height:1;letter-spacing:1px}
.stat i{display:block;font-style:normal;font-weight:700;text-transform:uppercase;font-size:11.5px;line-height:1.3;margin-top:4px}
.stat small{display:block;font-size:11px;color:var(--muted);margin-top:3px;font-weight:700}
.ins{flex:0 0 230px;max-width:100%;margin:0;background:var(--white);border:3px solid var(--navy-d);border-radius:8px;overflow:hidden;box-shadow:0 4px 0 var(--navy-d);align-self:flex-start}
.ins.wide{flex-basis:340px}
.ins.feat{flex:1 1 100%;max-width:620px;margin-inline:auto;border-width:4px;box-shadow:0 6px 0 var(--navy-d),0 0 0 4px var(--gold)}
.ins.feat figcaption{font-size:17px}
.ins svg{display:block;width:100%;height:auto}
.ins figcaption{background:var(--navy);color:var(--gold);font-family:var(--f-display);font-size:14px;letter-spacing:1px;text-align:center;padding:4px 6px 2px;border-top:3px solid var(--gold)}
.stage .sfx{top:2px}
.foot{color:#d6e6ff;font-size:12px;text-align:center;line-height:1.5}
.foot kbd{background:var(--white);color:var(--navy-d);border:2px solid var(--navy-d);border-radius:4px;padding:0 5px;font-family:var(--f-letter);font-weight:700}

.page.on{animation:enter .45s cubic-bezier(.2,.8,.2,1)}
.page.on .panel{animation:pop .5s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i,0)*80ms)}
.page.on .sfx{animation:sfxIn .5s cubic-bezier(.2,1.6,.4,1) both,sfx 2.6s ease-in-out .5s infinite}
@keyframes enter{from{transform:translateY(18px)}to{transform:none}}
@keyframes pop{from{transform:scale(.94)}to{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.015)}}
@keyframes breatheF{0%,100%{transform:scaleX(-1) scaleY(1)}50%{transform:scaleX(-1) scaleY(1.015)}}
@keyframes jump{0%,100%{transform:translateY(0)}40%{transform:translateY(-20px) rotate(-4deg)}}
@keyframes jumpF{0%,100%{transform:scaleX(-1) translateY(0)}40%{transform:scaleX(-1) translateY(-20px) rotate(-4deg)}}
@keyframes sfx{0%,100%{transform:rotate(var(--r,-8deg)) scale(1)}50%{transform:rotate(calc(var(--r,-8deg) + 3deg)) scale(1.06)}}
@keyframes sfxIn{from{transform:rotate(var(--r,-8deg)) scale(.3)}to{transform:rotate(var(--r,-8deg)) scale(1)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media (max-width:640px){
  .panel{grid-column:span 6}
  .blurbs,.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .caps.two{grid-template-columns:1fr}
  .stage{height:176px}
  .actor .fig{max-height:170px}
  .cover .stage{height:150px}
  .cap{max-width:100%}
  .ins,.ins.wide{flex:1 1 100%;max-width:360px;margin-inline:auto}
  .ins.feat{max-width:100%}
  .place{position:relative;left:auto;top:auto;align-self:flex-start;margin:8px 8px 0}
  .place+*{margin-top:0}
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<pattern id="ikat" width="12" height="10" patternUnits="userSpaceOnUse"><rect width="12" height="10" fill="#eef4ff"/><path d="M6 0 L12 5 L6 10 L0 5Z" fill="#2c62c4"/><path d="M6 2.4 L9 5 L6 7.6 L3 5Z" fill="#ffb700"/><circle cx="6" cy="5" r="1" fill="#e8642c"/></pattern>
<pattern id="ikat2" width="14" height="12" patternUnits="userSpaceOnUse"><rect width="14" height="12" fill="#bfe0f7"/><path d="M7 0 L14 6 L7 12 L0 6Z" fill="#3f8fd8"/><path d="M7 3 L10.5 6 L7 9 L3.5 6Z" fill="#f4f7fb"/><circle cx="7" cy="6" r="1.4" fill="#e8b23a"/><circle cx="0" cy="0" r="1.3" fill="#e8642c"/><circle cx="14" cy="12" r="1.3" fill="#e8642c"/></pattern>
</defs></svg>

<div class="wrap" id="app">
  <div class="nav">
    <div class="brand">OPERASIONAL CABANG<small>Chapter 1 · Satu Hari Penuh Aksi</small></div>
    <div class="btns">
      <button class="btn ghost" id="prev" type="button">‹ Sebelumnya</button>
      <button class="btn" id="next" type="button">Berikutnya ›</button>
      <button class="btn ghost" id="all" type="button" aria-pressed="false">Lihat semua</button>
    </div>
  </div>
  <div class="dots" id="dots" aria-label="Pilih episode"></div>
  <div id="book"></div>
  <p class="foot">Tekan <kbd>←</kbd> <kbd>→</kbd> atau geser layar untuk pindah episode · Ketuk tokoh untuk membuatnya melompat</p>
</div>

<script>
const S='#0a1f44';
/* ================= TOKOH ================= */
const CH={
 bm:{role:'BM',skin:'#f1c6a3',hair:'wavy',hc:'#2a1a12',top:'blazer',tc:'#ece3d3',inner:'#1b1b1b',pants:'#e3d8c6',lips:1,id:1,neck:1},
 bos:{role:'BOM/BOS',skin:'#e0aa83',hair:'short',hc:'#1b1b1b',top:'shirt',tc:'url(#ikat2)',pants:'#16285a',id:1},
 cs:{role:'CS',skin:'#f0c29e',hair:'hijab',hc:'#1b2a5c',top:'blazer',tc:'#4c9be0',inner:'url(#ikat)',pants:'#16285a',lips:1,id:1},
 tel:{role:'Teller',skin:'#f3c9a6',hair:'bun',hc:'#1f1612',top:'blazer',tc:'#4c9be0',inner:'url(#ikat)',pants:'#16285a',lips:1,id:1},
 sat:{role:'Security',skin:'#c48a5f',hair:'beret',hc:'#111',top:'satpam',tc:'#f2e3a0',pants:'#3a2a24',short:1},
 n1:{role:'Nasabah',skin:'#c98d68',hair:'short',hc:'#2a1b12',top:'tee',tc:'#2f9e6e',pants:'#3b4a6b'},
 n2:{role:'Nasabah',skin:'#e7b28c',hair:'hijab',hc:'#d9577a',top:'tee',tc:'#f6d7e4',pants:'#6b4a7b',lips:1},
 n3:{role:'Nasabah',skin:'#efc7a8',hair:'short',hc:'#e8e8e8',top:'jacket',tc:'#8a5a34',inner:'#f4f4f4',pants:'#5a5a5a',glasses:1},
 n4:{role:'Nasabah',skin:'#f0c29e',hair:'bob',hc:'#6b3a1e',top:'tee',tc:'#ff8a3d',pants:'#2f4b7c',lips:1}
};
function fig(id,o={}){
 const c=CH[id],ex=o.ex||'smile',p=o.pose||'rest',sk=c.skin,tc=c.tc;
 let s='<svg viewBox="0 0 120 200" class="fig" aria-hidden="true">';
 if(c.hair==='wavy') s+=`<path d="M26 56 C18 12 102 12 94 56 C102 76 92 98 100 120 C88 128 32 128 20 120 C28 98 18 76 26 56Z" fill="${c.hc}" stroke="${S}" stroke-width="2.5"/>`;
 if(c.hair==='bun') s+=`<circle cx="85" cy="72" r="10" fill="${c.hc}" stroke="${S}" stroke-width="2.5"/><path d="M80 66 q6 4 10 0" stroke="${S}" stroke-width="1" fill="none" opacity=".6"/>`;
 if(c.hair==='bob') s+=`<path d="M26 58 C20 14 100 14 94 58 L96 88 C80 95 40 95 24 88Z" fill="${c.hc}" stroke="${S}" stroke-width="2.5"/>`;
 s+=`<rect x="35" y="138" width="24" height="52" rx="8" fill="${c.pants}" stroke="${S}" stroke-width="2.5"/><rect x="61" y="138" width="24" height="52" rx="8" fill="${c.pants}" stroke="${S}" stroke-width="2.5"/>`;
 s+=`<ellipse cx="45" cy="192" rx="15" ry="6.5" fill="#15151a" stroke="${S}" stroke-width="2"/><ellipse cx="75" cy="192" rx="15" ry="6.5" fill="#15151a" stroke="${S}" stroke-width="2"/><path d="M38 189 h8 M68 189 h8" stroke="#fff" stroke-width="1.5" opacity=".5"/>`;
 s+=`<path d="M20 152 C12 110 28 84 60 82 C92 84 108 110 100 152 C84 162 36 162 20 152Z" fill="${tc}" stroke="${S}" stroke-width="2.5"/>`;
 if(c.top==='blazer'){
  s+=`<path d="M46 86 L60 124 L74 86Z" fill="${c.inner}" stroke="${S}" stroke-width="2"/><path d="M46 86 L38 104 L55 112Z M74 86 L82 104 L65 112Z" fill="${tc}" stroke="${S}" stroke-width="2" stroke-linejoin="round"/>`;
  s+=`<path d="M60 124 L60 158" stroke="${S}" stroke-width="1.6"/><circle cx="56" cy="134" r="2.2" fill="${S}"/><circle cx="56" cy="145" r="2.2" fill="${S}"/><path d="M28 132 h14 M78 132 h14" stroke="${S}" stroke-width="1.6"/>`;
 }
 if(c.top==='shirt'){
  s+=`<path d="M45 84 L60 98 L75 84 L73 96 L60 104 L47 96Z" fill="${tc}" stroke="${S}" stroke-width="2" stroke-linejoin="round"/><path d="M60 100 L60 154" stroke="${S}" stroke-width="1.6"/>`;
  [112,124,136,148].forEach(y=>s+=`<circle cx="60" cy="${y}" r="1.8" fill="#fff" stroke="${S}" stroke-width=".8"/>`);

function actor(a){const [id,ex,pose,flip]=a;const c=CH[id];return `<div class="actor${flip?' flip':''}" role="button" tabindex="0" aria-label="${c.role}">${fig(id,{ex,pose})}<span class="tag">${c.role}</span></div>`}
const TABLE=`<div class="tbl"><table><thead><tr><th>Keterangan</th><th>Cash Opname</th><th>Opname Stock Besar</th><th>Cross Opname</th></tr></thead><tbody>
<tr><th>Pengertian</th><td>Mencocokkan Buku Besar Kas Utama, Laporan Stok Uang Tunai/saldo khasanah di sistem, dan fisik uang tunai.</td><td>Mencocokkan seluruh fisik surat berharga termasuk Mandiri Debit dengan Laporan Stok di sistem.</td><td>Cek fisik uang tunai & surat berharga vs laporan sistem secara <strong>tidak terjadwal/acak</strong> oleh BM Cabang lain/pejabat di luar operasional cabang tsb., ditunjuk Area Head.</td></tr>
<tr><th>Pelaksana</th><td>Pemegang khasanah (<strong>BOM/BOS</strong>), diverifikasi <strong>CSO/CS Spv/CSR</strong>.</td><td>BOM/BOS, CSO/CS Spv/CSR, dan Teller.</td><td>Dikoordinir Area; dimonitor ABC/BBC Spv/BBC.</td></tr>
<tr><th>Frekuensi</th><td>Harian.</td><td>Periodik, <strong>minimal sebulan sekali</strong>.</td><td>Minimal 1× sebulan, <strong>tidak pada hari kerja terakhir</strong> akhir bulan.</td></tr>
<tr><th>Dokumen</th><td>BA Pemeriksaan Uang Rupiah & Valuta Asing; ATM kelolaan Cabang sesuai PTO Pengelolaan ATM dengan Berita Acara.</td><td>Berita Acara Pemeriksaan.</td><td>Berita Acara Pemeriksaan.</td></tr>
</tbody></table></div>`;
function panel(p,i){
  const ids=(p.f||[]).map(a=>a[0]);
  let h=`<section class="panel k-${p.sc||'plain'}${p.plain?' plain':''}" style="--s:${p.s};--i:${i}">${scene(p.sc,p.s===6)}`;
  if(SC[p.sc]) h+=`<span class="place">📍 ${SC[p.sc].n}</span>`.replace('📍 ','');
  if(p.cap) h+=`<div class="top"><p class="cap">${p.cap}</p></div>`;
  if(p.steps) h+=`<div class="caps ${p.stepsCls||''}">${p.steps.map(s=>`<div class="step" data-n="${s[0]}"><span>${s[1]}</span></div>`).join('')}</div>`;
  if(p.table) h+=TABLE;
  if(p.stats) h+=`<div class="stats">${p.stats.map(s=>`<div class="stat"><b>${s[0]}</b><i>${s[1]}</i><small>${s[2]}</small></div>`).join('')}</div>`;
  if(p.b||p.ins){h+='<div class="bals">';(p.b||[]).forEach((b,k)=>{const [w,t,o={}]=b;const idx=ids.indexOf(w);const side=(idx>=0&&idx>=ids.length/2&&ids.length>1)?'t-r':'t-l';
    h+=`<div class="bal ${side}${o.shout?' shout':''}${o.wide?' wide':''}" style="--d:${k}"><span class="who">${CH[w].role}</span>${t}</div>`});
    if(p.ins){const I=INS[p.ins];h+=`<figure class="ins${I.wide?' wide':''}${I.feat?' feat':''}">${I.d()}<figcaption>${I.c}</figcaption></figure>`}
    h+='</div>'}
  if(p.f){const sx=p.x?`<span class="sfx ${p.x.cls||''}" style="${/right/.test(p.x.pos)?'right':'left'}:6px;--r:${p.x.r||'-8deg'}" aria-hidden="true">${p.x.t}</span>`:'';h+=`<div class="stage">${p.f.map(actor).join('')}${sx}</div>`}
  else if(p.x) h+=`<span class="sfx ${p.x.cls||''}" style="${p.x.pos};--r:${p.x.r}" aria-hidden="true">${p.x.t}</span>`;
  return h+'</section>';
}

}
const book=document.getElementById('book'),dots=document.getElementById('dots');
P.forEach((pg,n)=>{
  const el=document.createElement('article');el.className='page';el.id='hal-'+(n+1);el.setAttribute('aria-label','Episode '+n);
  el.innerHTML=pg.cover?`<div class="body"><div class="grid">${cover()}</div></div>`:`<header class="phead"><span class="ep">EPISODE ${n}</span><h2>${pg.title}</h2><span class="kick">${pg.kick}</span></header><div class="body"><div class="grid">${pg.panels.map(panel).join('')}</div></div>`;
  book.appendChild(el);
  const d=document.createElement('button');d.type='button';d.className='dot';d.textContent=n===0?'★':n;d.title=pg.cover?'Sampul':pg.title;d.setAttribute('aria-label',pg.cover?'Sampul':'Episode '+n+': '+pg.title);d.onclick=()=>{go(n);top_()};dots.appendChild(d);
});
const pages=[...book.children];let cur=0,all=false;
function go(n,anim=true){
  cur=Math.max(0,Math.min(P.length-1,n));
  pages.forEach((p,i)=>{p.hidden=!all&&i!==cur;p.classList.remove('on')});
  if(!all&&anim){void pages[cur].offsetWidth;pages[cur].classList.add('on')}
  [...dots.children].forEach((d,i)=>d.setAttribute('aria-current',i===cur?'true':'false'));
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===P.length-1;
  if(!all&&location.hash!=='#hal-'+(cur+1)) try{history.replaceState(null,'','#hal-'+(cur+1))}catch(e){}
}
const top_=()=>document.getElementById('app').scrollIntoView({block:'start',behavior:'smooth'});
document.getElementById('prev').onclick=()=>{go(cur-1);top_()};
document.getElementById('next').onclick=()=>{go(cur+1);top_()};
document.getElementById('all').onclick=e=>{all=!all;e.currentTarget.setAttribute('aria-pressed',all);e.currentTarget.textContent=all?'Satu episode':'Lihat semua';book.classList.toggle('all',all);go(cur,false)};
addEventListener('keydown',e=>{if(all)return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
let sx=null,sy=null;book.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
book.addEventListener('touchend',e=>{if(sx===null||all)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5){go(cur+(dx<0?1:-1));top_()}sx=null},{passive:true});
book.addEventListener('click',e=>{const a=e.target.closest('.actor');if(!a)return;a.classList.remove('jump');void a.offsetWidth;a.classList.add('jump')});
book.addEventListener('keydown',e=>{const a=e.target.closest&&e.target.closest('.actor');if(a&&(e.key==='Enter'||e.key===' ')){e.preventDefault();a.click()}});
function fromHash(){const m=location.hash.match(/^#hal-(\d+)$/);go(m?+m[1]-1:0)}
addEventListener('hashchange',fromHash);fromHash();
